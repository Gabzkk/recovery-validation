[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "recovery-validation"
version = "1.0.0"
description = "Contained AES-256-GCM backup recovery validation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=50,<51"]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
recovery-validation = "recovery_validation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recovery_validation"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"tests/*.py" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["recovery_validation"]
